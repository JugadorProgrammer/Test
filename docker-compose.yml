services:
  app:
    build:
      context: .
    container_name: YOUR_PROJECT_NAME
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: YOUR_PORT
      DATABASE_URL: ${DATABASE_URL:-YOUR_DATABASE_URL}
    ports:
      - "YOUR_PORT:YOUR_PORT"

